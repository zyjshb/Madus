name: iOS IPA

on:
  workflow_dispatch:
  push:
    branches: ["codex/ios-native"]
    paths: ["ios/**", "scripts/build-ios.sh", "scripts/generate-ios-project.mjs", ".github/workflows/ios-ipa.yml"]
  pull_request:
    paths: ["ios/**", "scripts/build-ios.sh", "scripts/generate-ios-project.mjs", ".github/workflows/ios-ipa.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Test core and build unsigned IPA
        run: bash scripts/build-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Madus-iOS-unsigned
          path: |
            ios/build/Madus-iOS-unsigned.ipa
            ios/build/Madus-iOS-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
